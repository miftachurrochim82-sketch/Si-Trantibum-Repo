<script>
const { createApp, ref, computed, onMounted } = Vue;

// ==========================================
// KONSTANTA GLOBAL
// ==========================================
const ROLES = ["ADMIN", "KOORDINATOR", "PETUGAS", "PIMPINAN"];
const UNITS = ["Seksi Operasional dan Pengendalian", "Seksi Ketertiban Umum dan Ketentraman", "Seksi Penegakan Peraturan Perundang-undangan", "Bidang Linmas dan Pemadam Kebakaran", "Sekretariat"];

const LETTER_STATUS = {
  DRAFT: { label: "Draf", cls: "bg-slate-100 text-slate-700 ring-slate-200" },
  PENDING_APPROVAL: { label: "Menunggu Persetujuan", cls: "bg-amber-100 text-amber-800 ring-amber-200" },
  REJECTED: { label: "Ditolak / Revisi", cls: "bg-red-100 text-red-700 ring-red-200" },
  READY_TO_ISSUE: { label: "Siap Diterbitkan", cls: "bg-sky-100 text-sky-800 ring-sky-200" },
  ISSUED: { label: "Terbit (Issued)", cls: "bg-emerald-100 text-emerald-800 ring-emerald-200" },
  CANCELLED: { label: "Dibatalkan", cls: "bg-zinc-200 text-zinc-600 ring-zinc-300" },
  COMPLETED: { label: "Selesai Dilaksanakan", cls: "bg-teal-100 text-teal-800 ring-teal-200" },
};

const REPORT_STATUS = {
  DRAFT: { label: "Draf", cls: "bg-slate-100 text-slate-700 ring-slate-200" },
  SUBMITTED: { label: "Menunggu Verifikasi", cls: "bg-amber-100 text-amber-800 ring-amber-200" },
  VERIFIED: { label: "Terverifikasi", cls: "bg-emerald-100 text-emerald-800 ring-emerald-200" },
  RETURNED: { label: "Dikembalikan / Revisi", cls: "bg-red-100 text-red-700 ring-red-200" },
  CLOSED: { label: "Ditutup", cls: "bg-teal-100 text-teal-800 ring-teal-200" },
};

const SPEC_LABELS = { route: "Rute / Titik Pos / Objek", targetAudience: "Target Sasaran", materialTopic: "Materi Penyuluhan", threatIssue: "Isu / Potensi Kerawanan", riskLevel: "Tingkat Risiko", perdaRef: "Dasar Perda", objectTarget: "Objek Ditertibkan", massEstimate: "Estimasi Massa", tacticalGear: "Peralatan Dalmas" };
const ACTION_OPTIONS = ["Pembinaan / himbauan", "Teguran lisan", "Teguran tertulis", "Surat pernyataan", "Penyitaan sarana/barang bukti", "Pembongkaran", "Penyegelan sementara", "Diserahkan ke PPNS / instansi terkait", "Nihil — situasi kondusif"];

const FORM_TEMPLATES = {
  PATROLI: [
    { key: "violatorCount", label: "Jumlah Pelanggar / Temuan", type: "number", min: 0 },
    { key: "violationRef", label: "Acuan Perda", type: "select_perda" },
    { key: "actionTaken", label: "Tindakan Diambil", type: "select_action" }
  ],
  PENERTIBAN: [
    { key: "violatorCount", label: "Jumlah Pelanggar", type: "number", min: 0 },
    { key: "objectTarget", label: "Objek yang Ditertibkan", type: "text", placeholder: "Contoh: 15 PKL, 3 Reklame" },
    { key: "violationRef", label: "Acuan Perda", type: "select_perda" },
    { key: "actionTaken", label: "Tindakan Diambil", type: "select_action" }
  ],
  PENGAMANAN: [
    { key: "massEstimate", label: "Estimasi Massa", type: "text", placeholder: "± 500 Orang" },
    { key: "violatorCount", label: "Jumlah Temuan / Insiden", type: "number", min: 0 },
    { key: "actionTaken", label: "Tindakan Pengamanan", type: "text", placeholder: "Sterilisasi area, pengalihan arus..." }
  ],
  PEMBINAAN_PENYULUHAN: [
    { key: "targetAudience", label: "Target / Jumlah Peserta", type: "text", placeholder: "50 Pedagang Pasar" },
    { key: "materialTopic", label: "Materi yang Disampaikan", type: "text", placeholder: "Sosialisasi Perda Ketertiban" }
  ]
};

function fmtDate(s) { 
  if (!s) return "-"; 
  const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s); 
  return isNaN(d) ? s : d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }); 
}
function fmtDateTime(s) { 
  if (!s) return "-"; 
  const d = new Date(s); 
  return isNaN(d) ? s : d.toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); 
}
function genOfficial() { 
  return "800/" + (100 + Math.floor(Math.random() * 800)) + "/406.02/" + new Date().getFullYear(); 
}

createApp({
  setup() {
    // ----- STATE GLOBAL -----
    const data = ref(null); 
    const loading = ref(true); 
    const loadError = ref("");
    const role = ref("ADMIN"); 
    const tab = ref("dashboard"); 
    const adminSub = ref("users");
    const sidebarCollapsed = ref(false);
    
    try { 
      if (localStorage.getItem("si-trantibum-sidebar") === "collapsed") sidebarCollapsed.value = true; 
    } catch (e) {}

    const flash = ref({ text: "", type: "success" }); 
    const busy = ref(false);
    const isUploading = ref(false);

    // ----- STATE FILTER & PENCARIAN -----
    const qLetter = ref(""), fLetterStatus = ref("ALL"), fLetterAct = ref("ALL");
    const fLetterClass = ref("ALL"); 
    const qReport = ref(""), fReportStatus = ref("ALL"), fFuStatus = ref("ALL"), qMaster = ref("");
    
    const d = new Date();
    const filterYear = ref(d.getFullYear());
    const filterMonth = ref(d.getMonth() + 1);
    const monthsList = [{val: 1, label: 'Januari'}, {val: 2, label: 'Februari'}, {val: 3, label: 'Maret'}, {val: 4, label: 'April'}, {val: 5, label: 'Mei'}, {val: 6, label: 'Juni'}, {val: 7, label: 'Juli'}, {val: 8, label: 'Agustus'}, {val: 9, label: 'September'}, {val: 10, label: 'Oktober'}, {val: 11, label: 'November'}, {val: 12, label: 'Desember'}];
    const yearsList = computed(() => { const cy = new Date().getFullYear(); return [cy - 1, cy, cy + 1]; });

    const currentPage = ref({ letters: 1, reports: 1, fu: 1, master: 1, audit: 1 });
    const itemsPerPage = 25;
    function resetPage(tab) { currentPage.value[tab] = 1; }

    // ----- STATE MODAL & DETAIL -----
    const detailLetter = ref(null), detailReport = ref(null);
    const letterForm = ref(null), editingLetterId = ref(null), showExtra = ref(false), petugasQuery = ref(""), manualPetugas = ref("");
    const reportForm = ref(null), editingReportId = ref(null);
    const fuForm = ref(null), editingFuId = ref(null);
    const noteAction = ref(null), noteText = ref("");
    const masterForm = ref(null), confirmDel = ref(null);

    // ----- FUNGSI UI & GAS BRIDGE -----
    function showFlash(text, type) { 
      flash.value = { text, type: type || "success" }; 
      setTimeout(() => { if (flash.value.text === text) flash.value.text = ""; }, 4000); 
    }
    function toggleSidebar() { 
      sidebarCollapsed.value = !sidebarCollapsed.value; 
      try { localStorage.setItem("si-trantibum-sidebar", sidebarCollapsed.value ? "collapsed" : "expanded"); } catch (e) {} 
    }
    function runGas(fn) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          return reject(new Error("Halaman ini harus dibuka melalui URL Web App Google Apps Script."));
        }
        google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => reject(new Error(err && err.message ? err.message : "Gagal memanggil server")))[fn].apply(null, args);
      });
    }
    async function refresh() {
      try { data.value = await runGas("apiBootstrap"); loadError.value = ""; } 
      catch (e) { loadError.value = e.message; } 
      finally { loading.value = false; }
    }
    async function api(fn) {
      busy.value = true;
      try { const res = await runGas.apply(null, arguments); await refresh(); return res; } 
      catch (e) { showFlash(e.message, "error"); return null; } 
      finally { busy.value = false; }
    }
    onMounted(() => {
      const pre = document.getElementById('preloader');
      if (pre) { pre.style.opacity = '0'; setTimeout(() => { if (pre.parentNode) pre.parentNode.removeChild(pre); }, 350); }
      refresh();
    });

    // ----- COMPUTED PROPERTIES -----
    const currentUser = computed(() => data.value ? (data.value.users.find(u => u.role === role.value) || data.value.users[0]) : null);
    const actor = computed(() => ({ actorName: currentUser.value ? currentUser.value.name : "", actorRole: role.value }));
    const canCreateLetter = computed(() => ["ADMIN", "KOORDINATOR", "PIMPINAN"].includes(role.value));
    const canIssueLetter = canCreateLetter;
    const activeFormFields = computed(() => {
      if (!reportForm.value || !reportForm.value.activityCode) return FORM_TEMPLATES.PATROLI;
      return FORM_TEMPLATES[reportForm.value.activityCode] || FORM_TEMPLATES.PATROLI;
    });

    const stats = computed(() => {
      if (!data.value) return { letters: 0, pendingLetters: 0, issued: 0, reports: 0, pendingReports: 0, verified: 0, restricted: 0, activeFu: 0, overdueFu: 0, violators: 0 };
      const d = data.value;
      return {
        letters: d.letters.length, pendingLetters: d.letters.filter(l => l.status === "PENDING_APPROVAL").length,
        issued: d.letters.filter(l => l.status === "ISSUED").length, reports: d.reports.length,
        pendingReports: d.reports.filter(r => r.status === "SUBMITTED").length,
        verified: d.reports.filter(r => r.status === "VERIFIED" || r.status === "CLOSED").length,
        restricted: d.letters.filter(l => l.classification === "TERBATAS").length,
        activeFu: d.followUps.filter(f => f.status !== "SELESAI").length,
        overdueFu: d.followUps.filter(f => isOverdue(f)).length,
        violators: d.reports.reduce((a, r) => a + (Number(r.violatorCount) || 0), 0),
      };
    });

    const navItems = computed(() => [
      { key: "dashboard", label: "Dashboard & Aksi", short: "Home", icon: "fa-solid fa-chart-pie", badge: 0 },
      { key: "letters", label: "Surat Tugas (ST)", short: "ST", icon: "fa-solid fa-file-lines", badge: stats.value.pendingLetters },
      { key: "reports", label: "Laporan Kegiatan", short: "Laporan", icon: "fa-solid fa-clipboard-check", badge: stats.value.pendingReports },
      { key: "followups", label: "Tindak Lanjut", short: "Tindak", icon: "fa-solid fa-list-check", badge: stats.value.overdueFu },
      { key: "rekap", label: "Rekap & Statistik", short: "Rekap", icon: "fa-solid fa-chart-column", badge: 0 },
    ]);

    const workflowSteps = ["1. Koordinator / Pimpinan menyusun ST", "2. Pimpinan menyetujui = langsung terbit nomor resmi", "3. Petugas melapor hasil lapangan", "4. Koordinator memverifikasi laporan", "5. Tindak lanjut ditugaskan ke PIC"];

    function isOverdue(f) { if (!f.deadline || f.status === "SELESAI") return false; const t = new Date(); t.setHours(0,0,0,0); return new Date(f.deadline + "T00:00:00") < t; }
    function countLettersByAct(code) { return data.value ? data.value.letters.filter(l => l.activityCode === code).length : 0; }
    function countLetterStatus(k) { return data.value ? data.value.letters.filter(l => l.status === k).length : 0; }
    function barPct(v, max) { return Math.round((v / Math.max(1, max)) * 100); }
    
    const maxActCount = computed(() => data.value ? Math.max(1, ...data.value.activityTypes.map(a => countLettersByAct(a.code))) : 1);
    const maxRegionCount = computed(() => data.value ? Math.max(1, ...data.value.regions.map(r => data.value.letters.filter(l => l.location === r.name).length)) : 1);
    const regionsByLetters = computed(() => data.value ? [...data.value.regions].sort((a, b) => data.value.letters.filter(l => l.location === b.name).length - data.value.letters.filter(l => l.location === a.name).length) : []);
    const upcomingLetters = computed(() => data.value ? [...data.value.letters].filter(l => l.status !== "CANCELLED").sort((a, b) => String(a.startDate).localeCompare(String(b.startDate))).slice(0, 6) : []);
    const lettersWithoutReport = computed(() => data.value ? data.value.letters.filter(l => l.status === "ISSUED" && !data.value.reports.some(r => r.letterId === l.id)) : []);
    const issuedLetters = computed(() => data.value ? data.value.letters.filter(l => ["ISSUED", "COMPLETED"].includes(l.status)) : []);
    
    function dayOf(s) { return new Date(s + "T00:00:00").getDate(); }
    function monthOf(s) { return new Date(s + "T00:00:00").toLocaleDateString("id-ID", { month: "short" }); }

    const pendingActions = computed(() => {
      if (!data.value) return [];
      const d = data.value, items = [];
      if (["PIMPINAN", "ADMIN"].includes(role.value)) d.letters.filter(l => l.status === "PENDING_APPROVAL").forEach(l => items.push({ key: l.id, type: "Setujui & Terbitkan ST", title: l.code + " — " + l.title, status: "Persetujuan Pimpinan langsung menerbitkan nomor resmi", go: () => { tab.value = "letters"; detailLetter.value = l; } }));
      if (["KOORDINATOR", "PIMPINAN", "ADMIN"].includes(role.value)) {
        d.letters.filter(l => l.status === "DRAFT").forEach(l => items.push({ key: l.id, type: "Draf ST", title: l.code + " — " + l.title, status: role.value === "PIMPINAN" ? "Dapat diterbitkan langsung" : "Belum diajukan ke Pimpinan", go: () => { tab.value = "letters"; detailLetter.value = l; } }));
        d.letters.filter(l => l.status === "REJECTED").forEach(l => items.push({ key: l.id, type: "ST Perlu Revisi", title: l.code + " — " + l.title, status: "Dikembalikan Pimpinan untuk direvisi", go: () => { tab.value = "letters"; detailLetter.value = l; } }));
      }
      if (["KOORDINATOR", "ADMIN"].includes(role.value)) d.reports.filter(r => r.status === "SUBMITTED").forEach(r => items.push({ key: r.id, type: "Verifikasi Laporan", title: r.code + " — " + r.activityName, status: "Menunggu verifikasi koordinator", go: () => { tab.value = "reports"; detailReport.value = r; } }));
      if (["PETUGAS", "KOORDINATOR", "ADMIN"].includes(role.value)) lettersWithoutReport.value.forEach(l => items.push({ key: l.id, type: "Belum Ada Laporan", title: l.code + " — " + l.title, status: "ST terbit, laporan belum dibuat", go: () => { tab.value = "reports"; openNewReport(); } }));
      d.followUps.filter(f => isOverdue(f)).forEach(f => items.push({ key: f.id, type: "Tindak Lanjut Terlambat", title: f.code + " — " + String(f.actionRequired || "").slice(0, 70), status: "Lewat tenggat " + fmtDate(f.deadline), go: () => { tab.value = "followups"; } }));
      return items.slice(0, 8);
    });

    const filteredLetters = computed(() => !data.value ? [] : data.value.letters.filter(l => {
      const dateStr = String(l.startDate || l.letterDate || '');
      const parts = dateStr.split('T')[0].split('-');
      if (parts.length !== 3) {
        return (filterMonth.value === 0 && filterYear.value === 0) && (fLetterStatus.value === "ALL" || l.status === fLetterStatus.value) && (fLetterAct.value === "ALL" || l.activityCode === fLetterAct.value) && (fLetterClass.value === "ALL" || l.classification === fLetterClass.value) && (l.code + " " + l.title + " " + (l.officialNumber || "") + " " + l.location + " " + l.teamLeader).toLowerCase().includes(qLetter.value.toLowerCase());
      }
      const y = Number(parts[0]), m = Number(parts[1]);
      return (filterYear.value === 0 || y === filterYear.value) && (filterMonth.value === 0 || m === filterMonth.value) && (fLetterStatus.value === "ALL" || l.status === fLetterStatus.value) && (fLetterAct.value === "ALL" || l.activityCode === fLetterAct.value) && (fLetterClass.value === "ALL" || l.classification === fLetterClass.value) && (l.code + " " + l.title + " " + (l.officialNumber || "") + " " + l.location + " " + l.teamLeader).toLowerCase().includes(qLetter.value.toLowerCase());
    }));
    const paginatedLetters = computed(() => filteredLetters.value.slice((currentPage.value.letters - 1) * itemsPerPage, currentPage.value.letters * itemsPerPage));
    const totalLetterPages = computed(() => Math.ceil(filteredLetters.value.length / itemsPerPage) || 1);

    const filteredReports = computed(() => !data.value ? [] : data.value.reports.filter(r => {
      const dateStr = String(r.actualTime || r.createdAt || '');
      const parts = dateStr.split('T')[0].split('-');
      if (parts.length !== 3) {
        return (filterMonth.value === 0 && filterYear.value === 0) && (fReportStatus.value === "ALL" || r.status === fReportStatus.value) && (r.code + " " + r.stNumber + " " + r.activityName + " " + r.description + " " + r.actualLocation).toLowerCase().includes(qReport.value.toLowerCase());
      }
      const y = Number(parts[0]), m = Number(parts[1]);
      return (filterYear.value === 0 || y === filterYear.value) && (filterMonth.value === 0 || m === filterMonth.value) && (fReportStatus.value === "ALL" || r.status === fReportStatus.value) && (r.code + " " + r.stNumber + " " + r.activityName + " " + r.description + " " + r.actualLocation).toLowerCase().includes(qReport.value.toLowerCase());
    }));
    const paginatedReports = computed(() => filteredReports.value.slice((currentPage.value.reports - 1) * itemsPerPage, currentPage.value.reports * itemsPerPage));
    const totalReportPages = computed(() => Math.ceil(filteredReports.value.length / itemsPerPage) || 1);

    const filteredFu = computed(() => !data.value ? [] : data.value.followUps.filter(f => fFuStatus.value === "ALL" || (fFuStatus.value === "OVERDUE" ? isOverdue(f) : f.status === fFuStatus.value)));
    const paginatedFu = computed(() => filteredFu.value.slice((currentPage.value.fu - 1) * itemsPerPage, currentPage.value.fu * itemsPerPage));
    const totalFuPages = computed(() => Math.ceil(filteredFu.value.length / itemsPerPage) || 1);

    const masterRows = computed(() => !data.value ? [] : (data.value[adminSub.value] || []).filter(r => JSON.stringify(r).toLowerCase().includes(qMaster.value.toLowerCase())));
    const paginatedMaster = computed(() => masterRows.value.slice((currentPage.value.master - 1) * itemsPerPage, currentPage.value.master * itemsPerPage));
    const totalMasterPages = computed(() => Math.ceil(masterRows.value.length / itemsPerPage) || 1);

    const paginatedAuditLogs = computed(() => data.value ? data.value.auditLogs.slice((currentPage.value.audit - 1) * itemsPerPage, currentPage.value.audit * itemsPerPage) : []);
    const totalAuditPages = computed(() => data.value ? Math.ceil(data.value.auditLogs.length / itemsPerPage) || 1 : 1);

    function switchRole() { 
      showFlash("Beralih ke role " + role.value + (currentUser.value ? " — " + currentUser.value.name : "") + "."); 
      if (role.value !== "ADMIN" && tab.value === "admin") tab.value = "dashboard"; 
      currentPage.value = { letters: 1, reports: 1, fu: 1, master: 1, audit: 1 };
      fLetterClass.value = "ALL";
    }

    const actOfForm = computed(() => letterForm.value && data.value ? data.value.activityTypes.find(a => a.code === letterForm.value.activityCode) : null);
    const villageOptions = computed(() => { if (!letterForm.value || !data.value) return []; const reg = data.value.regions.find(r => r.name === letterForm.value.location); return reg ? data.value.villages.filter(v => v.regionCode === reg.code) : []; });
    const presets = computed(() => {
      if (!letterForm.value) return [];
      const kec = (letterForm.value.location || "").replace(/^Kecamatan\s+/i, "") || "Trenggalek";
      const name = actOfForm.value ? actOfForm.value.name : "";
      const map = {
        PENJAGAAN: ["Penjagaan Pendopo Kabupaten Trenggalek", "Penjagaan Kantor Bupati & Objek Vital Daerah", "Penjagaan Rumah Dinas Bupati Trenggalek", "Penjagaan Kantor Kecamatan " + kec],
        PATROLI: ["Patroli Wilayah Kecamatan " + kec, "Patroli Malam Ketertiban Umum Kecamatan " + kec, "Patroli Kawasan Alun-alun & Pusat Keramaian", "Patroli Pengawasan PKL & Parkir Liar Kecamatan " + kec],
        PENGAMANAN: ["Pengamanan Kegiatan Masyarakat di Kecamatan " + kec, "Pengamanan Kunjungan Kerja Pimpinan Daerah", "Pengamanan Acara Keagamaan/Budaya di Kecamatan " + kec, "Pengamanan Objek Vital & Fasilitas Umum"],
        PEMBINAAN_PENYULUHAN: ["Pembinaan & Penyuluhan Perda kepada Pelaku Usaha/PKL Kecamatan " + kec, "Sosialisasi Ketertiban Umum di Sekolah Kecamatan " + kec, "Pembinaan Satlinmas Desa/Kelurahan Kecamatan " + kec],
        DETEKSI_DINI_CEGAH_DINI: ["Deteksi Dini Potensi Kerawanan Trantibum di Kecamatan " + kec, "Pemetaan Kerawanan Jelang Hari Besar/Libur di Kecamatan " + kec, "Cegah Dini Gangguan Ketentraman Masyarakat Kecamatan " + kec],
        PENERTIBAN: ["Penertiban PKL & Parkir Liar di Kecamatan " + kec, "Penertiban Reklame Tanpa Izin/Kedaluwarsa di Kecamatan " + kec, "Penertiban Bangunan & Atribut Liar di Kecamatan " + kec, "Operasi Penegakan Perda di Kecamatan " + kec],
        PENGENDALIAN_MASSA: ["Pengendalian Massa Aksi Unjuk Rasa di Kecamatan " + kec, "Pengamanan & Pengendalian Kerumunan di Kecamatan " + kec, "Siaga Dalmas Pengendalian Massa Kab. Trenggalek"],
      };
      return map[letterForm.value.activityCode] || ["Kegiatan " + name + " di Kecamatan " + kec];
    });
    const vehicles = computed(() => data.value ? data.value.assets.filter(a => a.category.toLowerCase().includes("kendaraan")) : []);
    const equipments = computed(() => data.value ? data.value.assets.filter(a => !a.category.toLowerCase().includes("kendaraan")) : []);
    const candidates = computed(() => {
      if (!data.value) return [];
      const map = new Map();
      data.value.users.filter(u => u.role === "PETUGAS" || u.role === "KOORDINATOR").forEach(u => {
        const metaText = `${u.jabatan || u.role} · ${u.pangkatGol || ''} · NIP. ${u.nip}`;
        map.set(u.name, { name: u.name, meta: metaText });
      });
      if (letterForm.value) letterForm.value.personnel.forEach(p => { if (p.name && !map.has(p.name)) map.set(p.name, { name: p.name, meta: "Diinput manual" }); });
      return [...map.values()].filter(c => c.name.toLowerCase().includes(petugasQuery.value.toLowerCase()));
    });

    async function handleFileUpload(event) {
      const files = event.target.files;
      if (!files.length) return;
      isUploading.value = true;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.size > 3 * 1024 * 1024) {
          showFlash(`File ${file.name} terlalu besar (maks 3MB).`, "error");
          continue;
        }
        const base64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
        try {
          const res = await runGas("apiUploadFile", base64, file.name, file.type);
          if (res && res.success) {
            reportForm.value.evidenceList.push(res.url); 
          } else {
            showFlash("Gagal upload: " + (res ? res.error : "Unknown error"), "error");
          }
        } catch (err) {
          showFlash("Error: " + err.message, "error");
        }
      }
      isUploading.value = false;
      event.target.value = ""; 
    }

    function formatDropdownLabel(l) {
      const d = new Date(l.startDate);
      return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')} - ${l.title}`;
    }

    function blankLetter() {
      const today = new Date().toISOString().slice(0, 10);
      const first = data.value.users.find(u => u.role === "PETUGAS");
      return {
        activityCode: "PATROLI", title: "", legalBasis: "Perda No. 3 Tahun 2019 tentang Ketertiban Umum dan Ketentraman Masyarakat.", letterDate: today,
